[package]
name = "sampling_reverb_dsp"
version = "0.1.0"
edition = "2021"
description = "Sampling Reverb's real-time DSP core, exposed to the AU through a C ABI"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panic can't unwind across the C ABI; fail fast instead.
panic = "abort"
