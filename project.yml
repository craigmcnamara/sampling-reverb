name: SamplingReverb

options:
  bundleIdPrefix: com.craigmcnamara
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    # Ad-hoc "Sign to Run Locally". Set DEVELOPMENT_TEAM + Automatic to distribute.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO

targets:
  SamplingReverb:
    type: application
    platform: macOS
    sources:
      - App
    scheme:
      testTargets:
        - SamplingReverbTests
    dependencies:
      - target: SamplingReverbExtension
    settings:
      base:
        PRODUCT_NAME: "Sampling Reverb"
        PRODUCT_BUNDLE_IDENTIFIER: com.craigmcnamara.SamplingReverb
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sampling Reverb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: Sampling Reverb listens to your audio input so it can sample and reverberate it.
    entitlements:
      path: App/SamplingReverb.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true

  SamplingReverbExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
    settings:
      base:
        PRODUCT_NAME: SamplingReverbExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.craigmcnamara.SamplingReverb.Extension
        SWIFT_OBJC_BRIDGING_HEADER: Extension/AU/SamplingReverbExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Extension/DSP
          - $(SRCROOT)/Extension/AU
          - $(SRCROOT)/dsp/include
        # The Rust DSP core, built by the pre-build script below.
        OTHER_LDFLAGS:
          - $(SRCROOT)/build/rust/libsampling_reverb_dsp.a
        # The pre-build script writes to build/rust and runs cargo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust DSP
        script: '"$SRCROOT/tools/build-rust.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Sampling Reverb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - description: Sampling reverb that collects and replays phrases into a shimmering reverb
                manufacturer: Crmc
                name: "Craig McNamara: Sampling Reverb"
                sandboxSafe: true
                subtype: Smpv
                tags:
                  - Effects
                type: aufx
                version: 65536
    entitlements:
      path: Extension/SamplingReverbExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true

  # Pure-Swift UI logic, compiled directly into a hostless Swift Testing bundle.
  SamplingReverbTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Swift
      - Extension/UI/Logic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.craigmcnamara.SamplingReverbTests
        MACOSX_DEPLOYMENT_TARGET: "14.0"  # Swift Testing / XCTest require macOS 14
